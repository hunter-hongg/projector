name: Release

# Build release artifacts on every push to master (native runners only —
# cross-compiling libgit2-sys needs a C toolchain + OpenSSL for the target).
# Publish a GitHub Release (with all platform binaries) whenever a `v*` tag is pushed.

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: auto

jobs:
  build:
    name: Build (${{ matrix.artifact_suffix }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub-hosted native runners (free for public repos):
          # ubuntu-latest = x86_64, ubuntu-24.04-arm = aarch64,
          # macos-14 = arm64 (M1), macos-13 = x86_64 (Intel), windows-latest = x86_64.
          - os: ubuntu-latest
            artifact_suffix: linux-x86_64
          - os: ubuntu-24.04-arm
            artifact_suffix: linux-aarch64
          - os: macos-14
            artifact_suffix: macos-aarch64
          - os: macos-13
            artifact_suffix: macos-x86_64
          - os: windows-latest
            artifact_suffix: windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release --locked

      - name: Strip binary
        if: runner.os != 'Windows'
        run: strip target/release/projector

      - name: Determine version
        id: meta
        shell: bash
        run: |
          # Tag pushes drive the version (v0.0.1 → 0.0.1); master builds get a dev tag.
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev-$(date +%Y%m%d)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Package artifact
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN="target/release/projector.exe"
          else
            BIN="target/release/projector"
          fi
          NAME="projector-${{ steps.meta.outputs.version }}-${{ matrix.artifact_suffix }}"
          mkdir -p dist
          cp "$BIN" "dist/${NAME}"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "${NAME}.zip" "${NAME}"
          else
            tar -czf "${NAME}.tar.gz" "${NAME}"
          fi
          echo "artifact=dist/${NAME}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: projector-${{ steps.meta.outputs.version }}-${{ matrix.artifact_suffix }}
          path: dist/projector-${{ steps.meta.outputs.version }}-${{ matrix.artifact_suffix }}.*

  release:
    name: Publish GitHub Release
    needs: build
    # Only publish when a `v*` tag is pushed.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate release notes
        run: |
          {
            echo "## What's changed"
            echo
            # Commits since the previous tag (fallback: last 50 commits).
            PREV="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo HEAD~50)"
            git log "${PREV}"..HEAD --format='- %s (%h)' | head -50
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/projector-*
          generate_release_notes: true
          draft: false
          prerelease: false
