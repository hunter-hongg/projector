name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: [rustfmt, clippy]
      - name: 格式检查
        run: cargo fmt --check
      - name: 静态检查
        run: cargo clippy --all-targets -- -D warnings
      - name: 测试
        run: cargo test
